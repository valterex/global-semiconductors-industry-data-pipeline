name: CI

# Actions are pinned to full commit SHAs (with a `# vN` comment showing the tag)
# rather than mutable tags like `@v4`. Tags can be retagged to point at new
# (potentially malicious) code; a SHA is immutable and content-addressed. The
# tradeoff is that we don't get updates automatically, so use Dependabot/Renovate
# to bump both the SHA and the `# vN` comment.

on:
  pull_request:
    # Skip the pipeline for documentation-only changes.
    paths-ignore:
      - "**/*.md"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff + lockfile)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-uv

      - name: Check lockfile is in sync
        run: uv lock --check

      - name: Install dev dependencies
        run: uv sync --group dev

      - name: Run ruff (lint)
        run: uv run ruff check .

      - name: Run ruff (format check)
        run: uv run ruff format --check .

  dbt:
    name: dbt (deps + parse)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dbt
    env:
      GCP_PROJECT_ID: ci-project
      GCP_DATASET: global_semiconductor_industry
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-uv

      - name: Install dbt dependencies
        run: uv sync --group dbt

      - name: Create profiles.yml
        run: cp profiles.yml.example profiles.yml

      - name: Cache dbt packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: dbt/dbt_packages
          key: dbt-packages-${{ hashFiles('dbt/package-lock.yml') }}

      - name: Install dbt packages
        run: uv run --group dbt dbt deps --profiles-dir .

      - name: Parse project
        run: uv run --group dbt dbt parse --profiles-dir .

  typecheck:
    name: Typecheck (basedpyright)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-uv

      - name: Install type checker and dashboard dependencies
        run: uv sync --group dev --group dashboard

      - name: Run basedpyright
        run: uv run basedpyright

  test:
    name: Test (pytest + coverage)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-uv

      - name: Install test and dashboard dependencies
        run: uv sync --group dev --group dashboard

      - name: Run pytest with coverage
        run: uv run pytest

      - name: Coverage comment
        uses: py-cov-action/python-coverage-comment-action@e5fb2218463c3377f3504b0c5b5646ed53da7a2f # v4.5
        with:
          GITHUB_TOKEN: ${{ github.token }}

  yamllint:
    name: Lint (yamllint)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-uv

      - name: Install yamllint
        run: uv sync --group dev

      - name: Run yamllint
        run: uv run yamllint -c .yamllint.yml flows dbt compose.yaml

  sqlfluff:
    name: Lint (sqlfluff)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-uv

      - name: Install sqlfluff
        run: uv sync --group sqlfluff

      - name: Run sqlfluff
        run: uv run sqlfluff lint dbt/models dbt/tests

  terraform-validate:
    name: Validate (terraform)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.0

      - name: terraform init
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate -no-color

  tflint:
    name: Lint (tflint)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0

      - name: Init tflint plugins
        run: tflint --init

      - name: Run tflint
        run: tflint -f compact --minimum-failure-severity=error

id: 01_gcp_kv
namespace: semiconductor
description: |
  Store the GCP configuration in the KV store for the ingest flow.
  Run once before 02_gcp_ingest.

inputs:
  - id: gcp_project_id
    type: STRING
    required: true
    description: GCP project ID hosting BigQuery and GCS.

  - id: gcp_bucket_name
    type: STRING
    required: true
    description: GCS bucket name, without the gs:// prefix.

  - id: gcp_location
    type: STRING
    defaults: "EU"
    description: GCP region for BigQuery and GCS.

  - id: gcp_dataset
    type: STRING
    defaults: "global_semiconductor_industry"
    description: BigQuery dataset name.

tasks:
  - id: set_gcp_project_id
    type: io.kestra.plugin.core.kv.Set
    key: GCP_PROJECT_ID
    kvType: STRING
    value: "{{ inputs.gcp_project_id }}"

  - id: set_gcp_location
    type: io.kestra.plugin.core.kv.Set
    key: GCP_LOCATION
    kvType: STRING
    value: "{{ inputs.gcp_location }}"

  - id: set_gcp_bucket_name
    type: io.kestra.plugin.core.kv.Set
    key: GCP_BUCKET_NAME
    kvType: STRING
    value: "{{ inputs.gcp_bucket_name }}"

  - id: set_gcp_dataset
    type: io.kestra.plugin.core.kv.Set
    key: GCP_DATASET
    kvType: STRING
    value: "{{ inputs.gcp_dataset }}"

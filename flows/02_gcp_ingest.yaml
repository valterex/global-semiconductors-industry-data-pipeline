id: 02_gcp_ingest
namespace: semiconductor
description: |
  ELT pipeline for the Kaggle semiconductor dataset:
    1. Extract the 5 CSV files via kagglehub (Python).
    2. Stage data to Google Cloud Storage.
    3. Create a BigQuery external table over each GCS file.
    4. Materialize partitioned + clustered native tables via CTAS.

  Requires the KV store values from 01_gcp_kv. GCP authentication uses
  Application Default Credentials (GOOGLE_APPLICATION_CREDENTIALS).

variables:
  gcs_bucket: "gs://{{ kv('GCP_BUCKET_NAME') }}"

tasks:
  - id: extract
    type: io.kestra.plugin.scripts.python.Script
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      pullPolicy: IF_NOT_PRESENT
    containerImage: kestra-semiconductor:latest
    outputFiles:
      - "*.csv"
    script: |
      import os
      import shutil
      import kagglehub

      FILES = [
          "ai_chip_market.csv",
          "chip_prices.csv",
          "export_controls.csv",
          "fab_capacity.csv",
          "chip_companies_financials.csv",
      ]

      path = kagglehub.dataset_download("sergionefedov/global-semiconductor-industry-2010-2026")
      
      for file_name in FILES:
          shutil.copy(os.path.join(path, file_name), file_name)

  - id: stage_ai_chip_market
    type: io.kestra.plugin.gcp.gcs.Upload
    from: "{{ outputs.extract.outputFiles['ai_chip_market.csv'] }}"
    to: "{{ render(vars.gcs_bucket) }}/ai_chip_market.csv"

  - id: stage_chip_prices
    type: io.kestra.plugin.gcp.gcs.Upload
    from: "{{ outputs.extract.outputFiles['chip_prices.csv'] }}"
    to: "{{ render(vars.gcs_bucket) }}/chip_prices.csv"

  - id: stage_export_controls
    type: io.kestra.plugin.gcp.gcs.Upload
    from: "{{ outputs.extract.outputFiles['export_controls.csv'] }}"
    to: "{{ render(vars.gcs_bucket) }}/export_controls.csv"

  - id: stage_fab_capacity
    type: io.kestra.plugin.gcp.gcs.Upload
    from: "{{ outputs.extract.outputFiles['fab_capacity.csv'] }}"
    to: "{{ render(vars.gcs_bucket) }}/fab_capacity.csv"

  - id: stage_chip_companies_financials
    type: io.kestra.plugin.gcp.gcs.Upload
    from: "{{ outputs.extract.outputFiles['chip_companies_financials.csv'] }}"
    to: "{{ render(vars.gcs_bucket) }}/chip_companies_financials.csv"

  - id: create_external_ai_chip_market
    type: io.kestra.plugin.gcp.bigquery.Query
    sql: |
      CREATE OR REPLACE EXTERNAL TABLE `{{ kv('GCP_PROJECT_ID') }}.{{ kv('GCP_DATASET') }}.ai_chip_market_external`
      (year INT64, chip_name STRING, vendor STRING, launch_date DATE, memory_gb INT64, fp16_tflops INT64, tdp_watts INT64, estimated_shipments_units INT64, estimated_asp_usd INT64, estimated_revenue_usd_m FLOAT64, description STRING)
      OPTIONS (
        format = 'CSV',
        uris = ['{{ render(vars.gcs_bucket) }}/ai_chip_market.csv'],
        skip_leading_rows = 1,
        ignore_unknown_values = TRUE
      );

  - id: materialize_ai_chip_market
    type: io.kestra.plugin.gcp.bigquery.Query
    sql: |
      CREATE OR REPLACE TABLE `{{ kv('GCP_PROJECT_ID') }}.{{ kv('GCP_DATASET') }}.ai_chip_market`
      PARTITION BY DATE_TRUNC(launch_date, MONTH)
      CLUSTER BY vendor, chip_name
      AS SELECT * FROM `{{ kv('GCP_PROJECT_ID') }}.{{ kv('GCP_DATASET') }}.ai_chip_market_external`
      WHERE launch_date IS NOT NULL;

  - id: create_external_chip_prices
    type: io.kestra.plugin.gcp.bigquery.Query
    sql: |
      CREATE OR REPLACE EXTERNAL TABLE `{{ kv('GCP_PROJECT_ID') }}.{{ kv('GCP_DATASET') }}.chip_prices_external`
      (year_month STRING, year INT64, product STRING, currency STRING, unit STRING, price FLOAT64)
      OPTIONS (
        format = 'CSV',
        uris = ['{{ render(vars.gcs_bucket) }}/chip_prices.csv'],
        skip_leading_rows = 1,
        ignore_unknown_values = TRUE
      );

  - id: materialize_chip_prices
    type: io.kestra.plugin.gcp.bigquery.Query
    sql: |
      CREATE OR REPLACE TABLE `{{ kv('GCP_PROJECT_ID') }}.{{ kv('GCP_DATASET') }}.chip_prices`
      PARTITION BY RANGE_BUCKET(year, GENERATE_ARRAY(2010, 2031, 1))
      CLUSTER BY product
      AS SELECT * FROM `{{ kv('GCP_PROJECT_ID') }}.{{ kv('GCP_DATASET') }}.chip_prices_external`
      WHERE year IS NOT NULL;

  - id: create_external_export_controls
    type: io.kestra.plugin.gcp.bigquery.Query
    sql: |
      CREATE OR REPLACE EXTERNAL TABLE `{{ kv('GCP_PROJECT_ID') }}.{{ kv('GCP_DATASET') }}.export_controls_external`
      (control_id STRING, date DATE, year INT64, month INT64, imposing_country STRING, target STRING, policy_name STRING, severity_score INT64, description STRING, is_us_action INT64, is_china_action INT64, is_netherlands_action INT64, is_trump_1_0 INT64, is_biden INT64, is_trump_2_0 INT64)
      OPTIONS (
        format = 'CSV',
        uris = ['{{ render(vars.gcs_bucket) }}/export_controls.csv'],
        skip_leading_rows = 1,
        ignore_unknown_values = TRUE
      );

  - id: materialize_export_controls
    type: io.kestra.plugin.gcp.bigquery.Query
    sql: |
      CREATE OR REPLACE TABLE `{{ kv('GCP_PROJECT_ID') }}.{{ kv('GCP_DATASET') }}.export_controls`
      PARTITION BY DATE_TRUNC(date, MONTH)
      CLUSTER BY imposing_country, target
      AS SELECT * FROM `{{ kv('GCP_PROJECT_ID') }}.{{ kv('GCP_DATASET') }}.export_controls_external`
      WHERE date IS NOT NULL;

  - id: create_external_fab_capacity
    type: io.kestra.plugin.gcp.bigquery.Query
    sql: |
      CREATE OR REPLACE EXTERNAL TABLE `{{ kv('GCP_PROJECT_ID') }}.{{ kv('GCP_DATASET') }}.fab_capacity_external`
      (year INT64, company STRING, country_iso3 STRING, process_node_nm INT64, fab_type STRING, monthly_wafer_capacity INT64, fab_started_year INT64)
      OPTIONS (
        format = 'CSV',
        uris = ['{{ render(vars.gcs_bucket) }}/fab_capacity.csv'],
        skip_leading_rows = 1,
        ignore_unknown_values = TRUE
      );

  - id: materialize_fab_capacity
    type: io.kestra.plugin.gcp.bigquery.Query
    sql: |
      CREATE OR REPLACE TABLE `{{ kv('GCP_PROJECT_ID') }}.{{ kv('GCP_DATASET') }}.fab_capacity`
      PARTITION BY RANGE_BUCKET(year, GENERATE_ARRAY(2010, 2031, 1))
      CLUSTER BY company, process_node_nm
      AS SELECT * FROM `{{ kv('GCP_PROJECT_ID') }}.{{ kv('GCP_DATASET') }}.fab_capacity_external`
      WHERE year IS NOT NULL;

  - id: create_external_chip_companies_financials
    type: io.kestra.plugin.gcp.bigquery.Query
    sql: |
      CREATE OR REPLACE EXTERNAL TABLE `{{ kv('GCP_PROJECT_ID') }}.{{ kv('GCP_DATASET') }}.chip_companies_financials_external`
      (year INT64, company_name STRING, ticker STRING, country_iso3 STRING, segment STRING, revenue_usd_bn FLOAT64, operating_margin_pct FLOAT64, operating_income_usd_bn FLOAT64, rd_spend_usd_bn FLOAT64, capex_usd_bn FLOAT64)
      OPTIONS (
        format = 'CSV',
        uris = ['{{ render(vars.gcs_bucket) }}/chip_companies_financials.csv'],
        skip_leading_rows = 1,
        ignore_unknown_values = TRUE
      );

  - id: materialize_chip_companies_financials
    type: io.kestra.plugin.gcp.bigquery.Query
    sql: |
      CREATE OR REPLACE TABLE `{{ kv('GCP_PROJECT_ID') }}.{{ kv('GCP_DATASET') }}.chip_companies_financials`
      PARTITION BY RANGE_BUCKET(year, GENERATE_ARRAY(2010, 2031, 1))
      CLUSTER BY company_name, segment
      AS SELECT * FROM `{{ kv('GCP_PROJECT_ID') }}.{{ kv('GCP_DATASET') }}.chip_companies_financials_external`
      WHERE year IS NOT NULL;

  - id: purge_files
    type: io.kestra.plugin.core.storage.PurgeCurrentExecutionFiles
    description: Remove the downloaded CSV files from Kestra storage.

pluginDefaults:
  - type: io.kestra.plugin.gcp
    values:
      projectId: "{{ kv('GCP_PROJECT_ID') }}"
      location: "{{ kv('GCP_LOCATION') }}"

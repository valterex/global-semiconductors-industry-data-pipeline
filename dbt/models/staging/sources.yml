sources:
  - name: raw
    description: >
      Native BigQuery tables materialized by the Kestra ingest pipeline,
      partitioned and clustered on time.
    database: "{{ env_var('GCP_PROJECT_ID') }}"
    schema: "{{ env_var('GCP_DATASET') }}"
    tables:
      - name: ai_chip_market
        description: >
          AI chip launches. One row per chip per year, with specs, shipments,
          and revenue.
        columns:
          - name: year
            description: Year the chip was on the market.
          - name: chip_name
            description: Name of the AI chip.
          - name: vendor
            description: Company that designs and sells the chip.
          - name: launch_date
            description: Date the chip was launched.
          - name: memory_gb
            description: On-chip memory in gigabytes.
          - name: fp16_tflops
            description: FP16 compute throughput in teraflops.
          - name: tdp_watts
            description: Thermal design power in watts.
          - name: estimated_shipments_units
            description: Estimated units shipped that year.
          - name: estimated_asp_usd
            description: Estimated average selling price in US dollars.
          - name: estimated_revenue_usd_m
            description: Estimated revenue in millions of US dollars.
          - name: description
            description: Free-text description of the chip.

      - name: export_controls
        description: >
          Export-control policies and their targets. One row per control action.
        columns:
          - name: control_id
            description: Unique identifier for the control action.
          - name: date
            description: Date the policy was enacted.
          - name: year
            description: Year the policy was enacted.
          - name: month
            description: Month the policy was enacted.
          - name: imposing_country
            description: Country imposing the control.
          - name: target
            description: Country or entity targeted by the control.
          - name: policy_name
            description: Name of the export-control policy.
          - name: severity_score
            description: Severity of the control, higher is stricter.
          - name: description
            description: Free-text description of the policy.
          - name: is_us_action
            description: "Flag: imposed by the US."
          - name: is_china_action
            description: "Flag: targets China."
          - name: is_netherlands_action
            description: "Flag: imposed by the Netherlands."
          - name: is_trump_1_0
            description: "Flag: enacted during the Trump 1.0 presidency."
          - name: is_biden
            description: "Flag: enacted during the Biden presidency."
          - name: is_trump_2_0
            description: "Flag: enacted during the Trump 2.0 presidency."

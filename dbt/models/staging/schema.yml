models:
  - name: stg_ai_chip_market
    description: >
      AI chip launches staged from the raw table. One row per chip per year.
    columns:
      - name: launch_date
        description: Date the chip was launched.
        data_tests:
          - not_null

  - name: stg_export_controls
    description: >
      Export-control policies staged from the raw table. One row per control
      action.
    columns:
      - name: control_id
        description: Unique identifier for the control action.
        data_tests:
          - not_null
          - unique
      - name: date
        description: Date the policy was enacted.
        data_tests:
          - not_null

models:
  - name: fct_export_controls
    description: >
      Export-control policies enriched with boolean flags and an administration
      label derived from the presidency-period flags. One row per control action.
    columns:
      - name: control_id
        description: Unique identifier for the control action.
        data_tests:
          - not_null
          - unique
      - name: date
        description: Date the policy was enacted.
        data_tests:
          - not_null
      - name: administration
        description: US administration in office when the action was taken.
        data_tests:
          - accepted_values:
              arguments:
                values: ['Trump 1.0', 'Biden', 'Trump 2.0', 'Other']

  - name: fct_ai_chip_market
    description: >
      AI chip launches with estimated revenue in millions of US dollars. One
      row per chip per year.
    columns:
      - name: chip_year_key
        description: Surrogate key identifying a chip launch by vendor, chip name, and year.
        data_tests:
          - not_null
          - unique
      - name: chip_name
        description: Name of the AI chip.
        data_tests:
          - not_null
      - name: vendor
        description: Company that designs and sells the chip.
        data_tests:
          - not_null
      - name: launch_date
        description: Date the chip was launched.
        data_tests:
          - not_null
      - name: estimated_revenue_usd_m
        description: Estimated revenue in millions of US dollars.

  - name: fct_ai_chip_revenue_yearly
    description: >
      AI chip revenue aggregated to one row per vendor per year, ready for
      dashboard consumption.
    columns:
      - name: vendor
        description: Company that designs and sells the chip.
        data_tests:
          - not_null
      - name: year
        description: Year the revenue was earned.
        data_tests:
          - not_null
      - name: revenue_usd_m
        description: Total estimated revenue in millions of US dollars.
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - vendor
              - year

  - name: fct_export_controls_yearly
    description: >
      Export-control actions aggregated to one row per year per administration,
      ready for dashboard consumption.
    columns:
      - name: year
        description: Year the actions were taken.
        data_tests:
          - not_null
      - name: administration
        description: US administration in office when the actions were taken.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Trump 1.0', 'Biden', 'Trump 2.0', 'Other']
      - name: actions
        description: Number of export-control actions in that year.
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - year
              - administration

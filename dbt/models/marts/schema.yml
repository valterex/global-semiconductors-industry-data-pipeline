models:
  - name: fct_export_controls
    description: >
      Export-control actions with a derived administration label. One row per
      control action.
    columns:
      - name: control_id
        description: Unique identifier for the control action.
        data_tests:
          - not_null
          - unique
      - name: enacted_date
        description: Date the policy was enacted.
        data_tests:
          - not_null
      - name: administration
        description: US administration in office when the action was taken.
        data_tests:
          - accepted_values:
              arguments:
                values: ['Trump 1.0', 'Biden', 'Trump 2.0', 'Other']

  - name: dim_ai_chips
    description: >
      AI chip catalog. One row per chip, with launch date, specs, and vendor.
    columns:
      - name: chip_key
        description: Surrogate key identifying a chip by vendor and chip name.
        data_tests:
          - not_null
          - unique
      - name: chip_name
        description: Name of the AI chip.
        data_tests:
          - not_null
      - name: vendor
        description: Company that designs and sells the chip.
        data_tests:
          - not_null
      - name: launch_date
        description: Date the chip was launched.
        data_tests:
          - not_null

  - name: fct_ai_chip_sales
    description: >
      AI chip sales estimates. One row per chip per year.
    columns:
      - name: chip_year_key
        description: Surrogate key identifying a chip-year by vendor, chip name, and year.
        data_tests:
          - not_null
          - unique
      - name: chip_key
        description: Foreign key to dim_ai_chips.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_ai_chips')
                field: chip_key
      - name: year
        description: Year the chip was on the market.
        data_tests:
          - not_null
      - name: estimated_revenue_usd_m
        description: Estimated revenue in millions of US dollars.

  - name: fct_ai_chip_revenue_yearly
    description: >
      AI chip revenue aggregated to one row per vendor per year, ready for
      dashboard consumption.
    columns:
      - name: vendor
        description: Company that designs and sells the chip.
        data_tests:
          - not_null
      - name: year
        description: Year the revenue was earned.
        data_tests:
          - not_null
      - name: estimated_revenue_usd_m
        description: Total estimated revenue in millions of US dollars.
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - vendor
              - year

  - name: fct_export_controls_yearly
    description: >
      Export-control actions aggregated to one row per year per administration,
      ready for dashboard consumption.
    columns:
      - name: year
        description: Year the actions were taken.
        data_tests:
          - not_null
      - name: administration
        description: US administration in office when the actions were taken.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Trump 1.0', 'Biden', 'Trump 2.0', 'Other']
      - name: actions
        description: Number of export-control actions in that year.
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - year
              - administration

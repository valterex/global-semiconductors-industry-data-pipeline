[project]
name = "data-pipeline-semiconductor-industry"
version = "0.1.0"
description = "Airflow ELT pipeline for the Global Semiconductor Industry Kaggle dataset"
readme = "README.md"
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "commitizen>=4.18.0",
    "pre-commit>=4.6.2",
    "ruff>=0.15.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
version_files = ["pyproject.toml:version"]

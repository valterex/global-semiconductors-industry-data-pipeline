[project]
name = "data-pipeline-semiconductor-industry"
version = "0.1.0"
description = "Data pipeline for semiconductor industry data processing and analysis."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "kagglehub>=1.0.2",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = [
    "ruff>=0.16.5",
]
dbt = [
    "dbt-bigquery>=1.12,<1.13",
    "dbt-core>=1.12,<1.13",
]

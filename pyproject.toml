[project]
name = "semiconductor-elt-pipeline"
version = "0.1.0"
description = "ELT pipeline for the Global Semiconductor Industry dataset on GCP."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "kagglehub>=1.0.2",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.basedpyright]
typeCheckingMode = "standard"
include = ["dashboard", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=dashboard --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
relative_files = true
omit = ["dashboard/app.py"]

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.16.5",
    "yamllint>=1.38",
]
dbt = [
    "dbt-bigquery>=1.12,<1.13",
    "dbt-core>=1.12,<1.13",
]
dashboard = [
    "streamlit>=1.40",
    "google-cloud-bigquery>=3.25",
    "google-cloud-bigquery-storage>=2.24",
    "pandas>=2.2",
    "db-dtypes>=1.3",
]
sqlfluff = [
    "sqlfluff>=4.4",
]

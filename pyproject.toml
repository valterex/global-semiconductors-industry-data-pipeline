[project]
name = "data-pipeline-semiconductor-industry"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "kagglehub>=1.0.2",
    "pandas>=3.0.5",
    "psycopg[binary]>=3.2.0",
    "sqlalchemy>=2.0.52",
    "tqdm>=4.70.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = [
    "ruff>=0.16.5",
]

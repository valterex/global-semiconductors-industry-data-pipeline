services:
  pgdatabase:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-global-semiconductor-industry-2010-2026}
    volumes:
      - global-semiconductor-industry-2010-2026:/var/lib/postgresql
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-global-semiconductor-industry-2010-2026}"]
      interval: 5s
      timeout: 5s
      retries: 10

  prefect-server:
    image: prefecthq/prefect:3-python3.12
    command: prefect server start --host 0.0.0.0 --port 4200
    environment:
      PREFECT_SERVER_DATABASE_CONNECTION_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgdatabase:5432/prefect
    ports:
      - "4200:4200"
    depends_on:
      pgdatabase:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  prefect-worker:
    build:
      context: .
      dockerfile: Dockerfile.prefect
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
    volumes:
      - ~/.kaggle:/root/.kaggle:ro
      - prefect_flows_cache:/root/.cache
    depends_on:
      prefect-server:
        condition: service_healthy

volumes:
  global-semiconductor-industry-2010-2026:
  prefect_flows_cache:
